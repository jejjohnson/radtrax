name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install mystmd
        run: npm install -g mystmd

      - name: Install docs dependencies
        run: uv sync --group docs

      # Builds both halves, assembles them into public/, repairs the
      # cross-generator references, and fails if any internal link — in either
      # half, or crossing between them — does not resolve.
      - name: Build and verify the documentation site
        # On failure, re-emit the broken links and errors as annotations so they
        # are readable on the PR and through the API without the job log.
        run: |
          set -o pipefail
          uv run python scripts/build_docs.py 2>&1 | tee build.log || {
            grep -E '^  - |[Ee]rror|[Ww]arning|missing|broken|Traceback' build.log \
              | head -50 | sed 's/^/::error title=docs build::/'
            exit 1
          }

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: public/

[project]
name = "radtrax"
version = "0.0.0"
description = "Differentiable radiative transfer in JAX and Equinox for methane and multi-gas remote sensing."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = [
    "radiative-transfer",
    "remote-sensing",
    "methane",
    "matched-filter",
    "retrieval",
    "jax",
    "equinox",
]
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
# The base install is JAX-only: geo carriers, table building and the Bayesian
# retrievals arrive through extras (package-boundaries rule 3).
dependencies = [
    "jax>=0.10",
    "jaxlib>=0.10",
    "equinox>=0.13",
    "jaxtyping>=0.3",
    "lineax>=0.1",
    "optimistix>=0.1",
    "gaussx>=0.6.5",
    "numpy>=2.0",
    "xarray",
    # backs the compressed-NetCDF round-trip of the cross-section tables.
    "netcdf4",
]

[project.optional-dependencies]
# HITRAN cross-section tables through HAPI (offline table building).
hitran = []
# GeoTensor operators (radtrax.geo): geotoolz, georeader.
geo = []
# scikit-learn background estimators for the matched filter.
cluster = []
# NumPyro and optax for Bayesian and MAP retrievals.
bayes = []

[project.urls]
Repository = "https://github.com/jejjohnson/radtrax"
Documentation = "https://jejjohnson.github.io/radtrax"

# gaussx is not on PyPI yet: resolve it from its tag, as plumax does.
[tool.uv.sources]
gaussx = { git = "https://github.com/jejjohnson/gaussx", tag = "v0.6.5" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.0",
]
lint = [
    "import-linter>=2.1",
    "ruff>=0.15.22",
]
typecheck = [
    "ty>=0.0.86",
]
docs = [
    # The prose half of the site is built by mystmd, a Node CLI installed with
    # `npm install -g mystmd` rather than through uv. See docs/README.md.
    # MkDocs here builds only the API reference, whose `objects.inv` is what
    # lets the MyST prose cross-reference into it.
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    "jupytext>=1.19.3",
    "ipykernel>=7.3.0",
    "nbconvert>=7.17.1",
    # matplotlib + watermark used by the example notebooks during local
    # re-execution. The guarded watermark cell in each notebook no-ops
    # if the package is missing, but installing it here lets the version
    # readout actually print under `nbconvert --execute`.
    "matplotlib>=3.11.2",
    "watermark>=2.6.0",
    # pygments 2.20.0 dropped the None -> '' coercion for HtmlFormatter(filename=...),
    # but pymdownx.highlight 10.21.x still passes the untitled-code-block title
    # through as None. Pin until a fixed pymdown-extensions release ships (#38).
    "pygments>=2.21.0,<2.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radtrax"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E402",
    "E721",
    "E731",
    "E741",
    # Matches plumax, whose radiative-transfer code moves here unchanged
    # (Wave 1): equation-dense docstring and comment lines are not wrapped
    # mid-formula; `ruff format` still enforces 88 columns on code.
    "E501",
    # jaxtyping shape annotations (Float[Array, "L G"]) read as forward refs.
    "F722",
    "F821",
    # Greek and math glyphs (σ, ν, Δ, ×, –) in docstrings and comments are
    # deliberate.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct invalid inputs and assert on the failure.
"tests/**" = ["B011"]

[tool.ruff.format]
# Format the code inside ``Examples:`` doctest blocks like real source.
docstring-code-format = true
docstring-code-line-length = 72

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
# `src/radtrax` is a testpath so that --doctest-modules collects the
# ``Examples:`` blocks in every Google-style docstring. They are executable
# documentation: if an example in the docs goes stale, CI fails.
testpaths = ["tests", "src/radtrax"]
# Test tiers (see "Test tiers" in AGENTS.md). CI runs every tier.
strict_markers = true
markers = [
    "slow: takes over ~1 s; deselect with -m 'not slow'",
    "integration: end-to-end workflows, optional dependencies, external tools",
]
addopts = """\
    --doctest-modules \
    --cov=src/radtrax \
    --cov-report=term-missing \
    --cov-report=xml:coverage.xml\
"""

[tool.coverage.run]
source = ["src/radtrax"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# Package-boundaries rule 2: radtrax never imports plumax, not even lazily.
# Plume physics imports radiative transfer, never the reverse; an import back
# would put a cycle in the GeoStack package graph. `lint-imports` checks it
# (`make lint`, lint.yml).
[tool.importlinter]
root_package = "radtrax"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "radtrax never imports plumax"
type = "forbidden"
source_modules = ["radtrax"]
forbidden_modules = ["plumax"]

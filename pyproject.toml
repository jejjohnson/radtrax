[project]
name = "mypackage"
version = "0.1.6"
description = "My short description for my project."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = []
requires-python = ">=3.12"
classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Development Status :: 2 - Pre-Alpha",
]
dependencies = []

[project.urls]
Repository = "https://github.com/jejjohnson/mypackage"

[project.scripts]
mypackage = "mypackage.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.0",
]
lint = [
    "ruff>=0.17.0",
]
typecheck = [
    "ty>=0.0.83",
]
docs = [
    # The prose half of the site is built by mystmd, a Node CLI installed with
    # `npm install -g mystmd` rather than through uv. See docs/README.md.
    # MkDocs here builds only the API reference, whose `objects.inv` is what
    # lets the MyST prose cross-reference into it.
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "jupytext>=1.19.3",
    "ipykernel>=7.3.0",
    "nbconvert>=7.16.6",
    # matplotlib + watermark used by the example notebooks during local
    # re-execution. The guarded watermark cell in each notebook no-ops
    # if the package is missing, but installing it here lets the version
    # readout actually print under `nbconvert --execute`.
    "matplotlib>=3.11.2",
    "watermark>=2.6.0",
    # pygments 2.20.0 dropped the None -> '' coercion for HtmlFormatter(filename=...),
    # but pymdownx.highlight 10.21.x still passes the untitled-code-block title
    # through as None. Pin until a fixed pymdown-extensions release ships (#38).
    "pygments>=2.21.0,<2.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mypackage"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct invalid inputs and assert on the failure.
"tests/**" = ["B011"]

[tool.ruff.format]
# Format the code inside ``Examples:`` doctest blocks like real source.
docstring-code-format = true
docstring-code-line-length = 72

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
# `src/mypackage` is a testpath so that --doctest-modules collects the
# ``Examples:`` blocks in every Google-style docstring. They are executable
# documentation: if an example in the docs goes stale, CI fails.
testpaths = ["tests", "src/mypackage"]
# Test tiers (see "Test tiers" in AGENTS.md). CI runs every tier.
strict_markers = true
markers = [
    "slow: takes over ~1 s; deselect with -m 'not slow'",
    "integration: end-to-end workflows, optional dependencies, external tools",
]
addopts = """\
    --doctest-modules \
    --cov=src/mypackage \
    --cov-report=term-missing \
    --cov-report=xml:coverage.xml\
"""

[tool.coverage.run]
source = ["src/mypackage"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
